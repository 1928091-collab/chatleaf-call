
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatLeaf 通話</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 40px 16px;
    }
    .box {
      background: white;
      max-width: 420px;
      margin: auto;
      padding: 25px;
      border-radius: 16px;
    }
    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 10px;
      background: #16a085;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ChatLeaf</h1>
    <h2>音声通話テスト</h2>
    <p>マイクが使えるか確認するよ。</p>
    <button onclick="testMic()">マイクをテスト</button>
    <p id="result">まだテストしていません。</p>
  </div>

  <script>
    async function testMic() {
      const result = document.getElementById('result');
      result.textContent = 'マイクを確認中...';

      try {
        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });

        result.textContent = 'マイク使用成功！';
        stream.getTracks().forEach(track => track.stop());

      } catch (error) {
        result.textContent =
          'エラー名：' + error.name +
          ' / 詳細：' + error.message;
      }
    }
  </script>
</body>
</html>
